[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actuarial-agent-harness"
version = "0.2.9.post1"
description = "A production harness for AI agents operating actuarial models."
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "chainladder==0.9.2",
    "fastapi==0.110.3",
    "pandas==2.3.3",
    "numpy==2.4.6",
    "uvicorn==0.30.1",
]

[project.scripts]
reserve = "harness.cli:main"

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "httpx==0.27.0",
    "playwright==1.61.0",
    "pytest==9.1.1",
]

[tool.setuptools]
packages = ["harness", "harness.render", "harness.render.templates", "harness.workbench", "harness.workbench.static_v2", "engine", "databricks_demo", "examples"]

[tool.setuptools.package-data]
"harness.render.templates" = ["*.html"]
"harness.workbench.static_v2" = ["*.html", "*.js", "*.css"]
"examples" = ["raa.csv", "triangle_gapped.csv"]
