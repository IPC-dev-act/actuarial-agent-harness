name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Python tests
        run: python -m pytest -q
      - name: Frontend syntax
        run: node --check harness/workbench/static_v2/app.js
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify packaged dashboard
        run: python -c "import glob, zipfile; p=glob.glob('dist/*.whl')[0]; n=zipfile.ZipFile(p).namelist(); assert any(x.endswith('harness/workbench/static_v2/app.js') for x in n); assert any(x.endswith('harness/workbench/static_v2/index.html') for x in n)"
